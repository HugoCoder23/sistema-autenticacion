spring:
  application:
    name: auth-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        # Instant -> DATETIME(6)/TIMESTAMP en UTC (mismo tipo en MySQL y en H2).
        type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # Solo para desarrollo. En producción se debe definir JWT_SECRET (mínimo 32 bytes, aleatoria).
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    issuer: ${JWT_ISSUER:auth-service}
    audience: ${JWT_AUDIENCE:auth-clients}
    # Access token corto: si se filtra, sirve poco tiempo.
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
  refresh:
    # Refresh token más largo, rotatorio y revocable. Viaja en una cookie HttpOnly.
    ttl-days: ${REFRESH_TTL_DAYS:7}
    cookie-name: refresh_token
    cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  password-reset:
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    # Enlace que se incluye en el correo (simulado en desarrollo).
    frontend-url: ${FRONTEND_URL:http://localhost:5175}
  rate-limit:
    # Intentos fallidos de login por email (o IP) antes de bloquear temporalmente.
    max-login-failures: ${MAX_LOGIN_FAILURES:5}
    window-minutes: ${LOGIN_WINDOW_MINUTES:15}
    # Solicitudes de recuperación por email dentro de la ventana.
    max-reset-requests: ${MAX_RESET_REQUESTS:3}
  mail:
    # Bandeja simulada: guarda los correos en memoria y los expone en /api/dev/mailbox.
    # NUNCA activar en producción.
    dev-outbox: ${DEV_OUTBOX_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5175}
  seed:
    # Carga cuentas de demostración FICTICIAS si la base está vacía.
    enabled: ${SEED_DEMO_DATA:true}
    demo-password: ${DEMO_PASSWORD:Demo1234!}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    with-credentials: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # preferred_instant_jdbc_type es estable en la práctica; evita un aviso repetido por cada entidad.
    org.hibernate.orm.incubating: ERROR

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:auth;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/auth}
    username: ${DB_USERNAME:auth}
    password: ${DB_PASSWORD}
app:
  mail:
    dev-outbox: ${DEV_OUTBOX_ENABLED:false}
